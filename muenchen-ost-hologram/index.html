<script>
(function(){
"use strict";
// ---------- Basis ----------
const BBOX = DATA.meta.bbox;              // [S,W,N,E] in Grad
const LAT0 = DATA.meta.center[0], LON0 = DATA.meta.center[1];
const KX = Math.cos(LAT0*Math.PI/180)*111320, KZ = 110540;
const X0 = (BBOX[1]-LON0)*KX, X1 = (BBOX[3]-LON0)*KX;   // West, Ost in m
const ZN = -(BBOX[2]-LAT0)*KZ, ZS = -(BBOX[0]-LAT0)*KZ;   // Nord(-z), Sued(+z) in m
const POLY = DATA.meta.poly; // [[x,z]...] Nutzer-Polygon
function pip(x, z){
  let inside=false; const n=POLY.length; let j=n-1;
  for(let i=0;i<n;i++){
    const xi=POLY[i][0], zi=POLY[i][1], xj=POLY[j][0], zj=POLY[j][1];
    if(((zi>z)!==(zj>z)) && (x < (xj-xi)*(z-zi)/(zj-zi)+xi)) inside=!inside;
    j=i;
  }
  return inside;
}
let PCX=0, PCZ=0;
POLY.forEach(p=>{PCX+=p[0];PCZ+=p[1];}); PCX/=POLY.length; PCZ/=POLY.length;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060d);
scene.fog = new THREE.FogExp2(0x04060d, 0.00010);

const CAM_HOME = new THREE.Vector3(PCX, 2500, PCZ+4300);

document.getElementById('app').appendChild(renderer.domElement);

controls.target.set(PCX, 0, PCZ);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.autoRotate = true; controls.autoRotateSpeed = 0.5;
controls.maxPolarAngle = Math.PI*0.495;
controls.minDistance = 150; controls.maxDistance = 12000;

// ---------- Helfer: Geometrien mergen ----------
function mergeTris(list){ // list: [{pos:[x,y,z...], col:[r,g,b...]}]
  let nv=0; list.forEach(g=>nv+=g.pos.length/3);
  const pos=new Float32Array(nv*3), col=new Float32Array(nv*3);
  let o=0;
  list.forEach(g=>{pos.set(g.pos,o*3);col.set(g.col,o*3);o+=g.pos.length/3;});
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  return geo;
}
function triPoly(points, y, color){ // points: [[x,z]...] -> Dreiecke via ShapeUtils
  const contour = points.map(p=>new THREE.Vector2(p[0], p[1]));
  const faces = THREE.ShapeUtils.triangulateShape(contour, []);
  const pos=[], col=[];
  const c = new THREE.Color(color);
  faces.forEach(f=>f.forEach(i=>{pos.push(points[i][0], y, points[i][1]); col.push(c.r,c.g,c.b);}));
  return {pos, col};
}
function polyOutline(points, y, color){
  const pos=[], col=[]; const c=new THREE.Color(color);
  for(let i=0;i<points.length;i++){
    const a=points[i], b=points[(i+1)%points.length];
    pos.push(a[0],y,a[1], b[0],y,b[1]); col.push(c.r,c.g,c.b, c.r,c.g,c.b);
  }
  return {pos, col};
}
function ribbon(pts, w, y, color){ // pts: [[x,z]...]
  const pos=[], col=[]; const c=new THREE.Color(color); const h=w/2;
  for(let i=0;i<pts.length-1;i++){
    const ax=pts[i][0], az=pts[i][1], bx=pts[i+1][0], bz=pts[i+1][1];
    let dx=bx-ax, dz=bz-az; const L=Math.hypot(dx,dz)||1; dx/=L; dz/=L;
    const nx=-dz*h, nz=dx*h;
    const q=[[ax+nx,az+nz],[ax-nx,az-nz],[bx+nx,bz+nz],[bx-nx,bz-nz]];
    [[0,1,2],[1,3,2]].forEach(t=>t.forEach(k=>{pos.push(q[k][0],y,q[k][1]);col.push(c.r,c.g,c.b);}));
  }
  return {pos, col};
}
const C = {
  bldFillA:new THREE.Color(0x0e4a5e), bldFillB:new THREE.Color(0x9beaff),
  bldEdgeA:new THREE.Color(0x1a6a86), bldEdgeB:new THREE.Color(0x8df4ff),
  roadMain:new THREE.Color(0xff2fd6), roadMinor:new THREE.Color(0x35d5f2),
  rail:new THREE.Color(0xff9a1f), water:new THREE.Color(0x2f9dff),
  park:new THREE.Color(0x0d4423), parkEdge:new THREE.Color(0x2fff7a),
  ostparkEdge:new THREE.Color(0x7dffb0), grass:new THREE.Color(0x0a3018)
};

// ---------- Plattform: Nutzer-Polygon + Grid + Ringe ----------
(function platform(){
  const pts = POLY;
  const fill = mergeTris([triPoly(pts, 0, 0x071522)]);
  const m = new THREE.Mesh(fill, new THREE.MeshBasicMaterial({vertexColors:true, transparent:true, opacity:0.92}));
  scene.add(m);
  function addRing(scale, color, opacity, y){
    const sp = pts.map(p=>[PCX+(p[0]-PCX)*scale, PCZ+(p[1]-PCZ)*scale]);
    const ring = polyOutline(sp, y, color);
    const rg = new THREE.BufferGeometry();
    rg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(ring.pos),3));
    rg.setAttribute('color', new THREE.BufferAttribute(new Float32Array(ring.col),3));
    scene.add(new THREE.LineSegments(rg, new THREE.LineBasicMaterial({vertexColors:true, transparent:true, opacity:opacity, fog:false})));
  }
  addRing(1.0, 0x46f6ff, 0.95, 3);
  addRing(1.03, 0x1b6f86, 0.30, 3);
  // Grid, aufs Polygon geclippt (Sampling alle 25 m)
  const gp=[], gc=[]; const gc0=new THREE.Color(0x0e3a4d);
  function gridLine(x0,z0,x1,z1){
    const L=Math.hypot(x1-x0,z1-z0), step=25;
    let run=[];
    for(let d=0; d<=L; d+=step){
      const x=x0+(x1-x0)*d/L, z=z0+(z1-z0)*d/L;
      if(pip(x,z)) run.push([x,z]); else { flush(run); run=[]; }
    }
    flush(run);
    function flush(r){ for(let i=0;i<r.length-1;i++){ gp.push(r[i][0],1,r[i][1], r[i+1][0],1,r[i+1][1]); gc.push(gc0.r,gc0.g,gc0.b,gc0.r,gc0.g,gc0.b);} }
  }
  for(let x=Math.ceil(X0/100)*100; x<=X1; x+=100) gridLine(x,ZN,x,ZS);
  for(let z=Math.ceil(ZN/100)*100; z<=ZS; z+=100) gridLine(X0,z,X1,z);
  const gg=new THREE.BufferGeometry();
  gg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(gp),3));
  gg.setAttribute('color', new THREE.BufferAttribute(new Float32Array(gc),3));
  scene.add(new THREE.LineSegments(gg, new THREE.LineBasicMaterial({vertexColors:true, transparent:true, opacity:0.5})));
})();

// ---------- Gebaeude: InstancedMesh (Fill) + gemergte Kanten ----------

{

      v.set(ep[k*3],ep[k*3+1],ep[k*3+2]).applyMatrix4(m4);

  scene.add(new THREE.LineSegments(eg, new THREE.LineBasicMaterial({vertexColors:true, transparent:true, opacity:0.85, fog:false})));
}

{

    m4.compose(v,q,s); cm.setMatrixAt(i,m4);
    cm.setColorAt(i, palette[c[6]%palette.length]);
    const ce=palette[c[6]%palette.length], base=i*24*3;
    for(let k=0;k<24;k++){
      v.set(ep[k*3],ep[k*3+1],ep[k*3+2]).applyMatrix4(m4);
      cPos[base+k*3]=v.x; cPos[base+k*3+1]=v.y; cPos[base+k*3+2]=v.z;
      cCol[base+k*3]=ce.r; cCol[base+k*3+1]=ce.g; cCol[base+k*3+2]=ce.b;
    }
  }
  cm.instanceMatrix.needsUpdate=true;
  if(cm.instanceColor) cm.instanceColor.needsUpdate=true;
  scene.add(cm);
  const cg=new THREE.BufferGeometry();
  cg.setAttribute('position', new THREE.BufferAttribute(cPos,3));
  cg.setAttribute('color', new THREE.BufferAttribute(cCol,3));
  scene.add(new THREE.LineSegments(cg, new THREE.LineBasicMaterial({vertexColors:true, transparent:true, opacity:0.9, fog:false})));
}

// ---------- Strassen / Gleise ----------
function addRibbons(list, w, y, color, opacity){
  if(!list.length) return;
  const geos=list.map(l=>ribbon(l,w,y,color));
  const mesh=new THREE.Mesh(mergeTris(geos),
    new THREE.MeshBasicMaterial({vertexColors:true, transparent:true, opacity:opacity,
      blending:THREE.AdditiveBlending, depthWrite:false, fog:false}));
  scene.add(mesh);
}
addRibbons(DATA.roads_main, 9, 2.0, C.roadMain, 0.80);
addRibbons(DATA.roads_minor, 5.5, 2.0, C.roadMinor, 0.55);
addRibbons(DATA.rails, 3.2, 2.6, C.rail, 0.85);
// Bahnsteige: flache orange Boxen
DATA.platforms.forEach(p=>{
  const g=new THREE.BoxGeometry(p[2],1.6,p[3]);
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xff9a1f,transparent:true,opacity:0.35,blending:THREE.AdditiveBlending,depthWrite:false}));
  m.position.set(p[0],0.8,p[1]); m.rotation.y=-p[4]; scene.add(m);
});

// ---------- Wasser / Parks / Becken ----------
function addPolys(list, y, fill, opacity, edgeColor, edgeOpacity){
  if(!list||!list.length) return;
  const fills=list.map(p=>triPoly(p,y,fill));
  scene.add(new THREE.Mesh(mergeTris(fills),
    new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:opacity,
      blending:THREE.AdditiveBlending,depthWrite:false})));
  if(edgeColor){
    let lp=[], lc=[];
    list.forEach(p=>{const o=polyOutline(p,y+0.4,edgeColor); lp=lp.concat(o.pos); lc=lc.concat(o.col);});
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(lp),3));
    geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(lc),3));
    scene.add(new THREE.LineSegments(geo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:edgeOpacity,fog:false})));
  }
}
addPolys(DATA.water_poly, 1.6, C.water, 0.55, 0x7dc4ff, 0.8);
addRibbons(DATA.water_line.map(w=>w.pts), 4, 1.6, C.water, 0.5);
addPolys(DATA.parks, 1.2, C.park, 0.60, C.parkEdge, 0.75);
addPolys(DATA.grass, 1.1, C.grass, 0.45, null, 0);
addPolys(DATA.pools, 1.6, C.water, 0.65, 0x9beaff, 0.9);
if(DATA.ostpark) addPolys([DATA.ostpark], 1.3, 0x0e5a2c, 0.70, C.ostparkEdge, 0.95);

// ---------- Werk-4-Turm (84 m, Wahrzeichen) ----------
const W4 = DATA.landmarks['WERK 4'];
if(W4){
  const tg=new THREE.BoxGeometry(34,84,34);
  const tm=new THREE.Mesh(tg,new THREE.MeshBasicMaterial({color:0xff2fd6,transparent:true,opacity:0.30}));
  tm.position.set(W4[0],42,W4[1]); scene.add(tm);
  const te=new THREE.LineSegments(new THREE.EdgesGeometry(tg),
    new THREE.LineBasicMaterial({color:0xff9a1f,transparent:true,opacity:0.95}));
  te.position.copy(tm.position); scene.add(te);
}

// ---------- Beacons + Labels ----------
const labelGroup=new THREE.Group(); scene.add(labelGroup);
const beacons=[];
function makeLabel(text, color){
  const cv=document.createElement('canvas'); cv.width=512; cv.height=128;
  const ctx=cv.getContext('2d');
  ctx.font='bold 54px "Courier New", monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor=color; ctx.shadowBlur=26; ctx.fillStyle='#eaffff';
  ctx.fillText(text,256,60); ctx.fillText(text,256,60);
  ctx.shadowBlur=0; ctx.fillStyle=color; ctx.font='bold 20px "Courier New", monospace';
  const tex=new THREE.CanvasTexture(cv);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,fog:false}));
  sp.scale.set(340,85,1);
  return sp;
}
const BEACON_DEF={
  'OSTBAHNHOF':{c:0x35d5f2,beam:0x35d5f2},
  'WERKSVIERTEL':{c:0x35d5f2,beam:0x35d5f2},
  'WERK 4':{c:'#ff5fa2',beam:0xff5fa2},
  'MICHAELIBAD':{c:0x2f9dff,beam:0x2f9dff},
  'BERG AM LAIM':{c:0xff9a1f,beam:0xff9a1f},
  'OSTPARK':{c:'#2fff7a',beam:null}
};
Object.keys(BEACON_DEF).forEach((name,idx)=>{
  const p=DATA.landmarks[name]; if(!p) return;
  const def=BEACON_DEF[name];
  const isPark=(name==='OSTPARK');
  if(def.beam!==null){
    const h=isPark?140:300;
    const cyl=new THREE.Mesh(new THREE.CylinderGeometry(16,22,h,20,1,true),
      new THREE.MeshBasicMaterial({color:def.beam,transparent:true,opacity:0.28,
        blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false}));
    cyl.position.set(p[0],h/2,p[1]); scene.add(cyl);
    beacons.push({mesh:cyl,phase:idx*1.3,base:0.28});
    const ring=new THREE.Mesh(new THREE.RingGeometry(20,30,48),
      new THREE.MeshBasicMaterial({color:def.beam,transparent:true,opacity:0.6,
        blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false}));
    ring.rotation.x=-Math.PI/2; ring.position.set(p[0],4,p[1]); scene.add(ring);
    beacons.push({mesh:ring,phase:idx*1.3+0.6,base:0.6,ring:true});
  }
  const label=makeLabel(name, typeof def.c==='string'?def.c:'#'+def.c.toString(16).padStart(6,'0'));
  label.position.set(p[0], isPark?420:360, p[1]);
  label.userData.phase=idx*0.9;
  labelGroup.add(label); beacons.push({mesh:label,phase:idx*0.9,base:1,sprite:true});
});

// ---------- Scanline-Ringe ----------
const scans=[];
for(let i=0;i<3;i++){
  const r=new THREE.Mesh(new THREE.RingGeometry(0.97,1.0,128),
    new THREE.MeshBasicMaterial({color:0x35d5f2,transparent:true,opacity:0.4,
      blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false}));
  r.rotation.x=-Math.PI/2; r.position.set(PCX,3,PCZ); scene.add(r);
  scans.push({mesh:r,off:i/3});
}
const DIAG=Math.hypot(X1-X0,ZS-ZN);

// ---------- Partikel-Staub + Sterne ----------
let pGeo, pSpeed;
(function particles(){
  const N=1400, pos=new Float32Array(N*3); pSpeed=new Float32Array(N);
  let placed=0, guard=0;
  while(placed<N && guard<20000){
    guard++;
    const x=X0+Math.random()*(X1-X0), z=ZN+Math.random()*(ZS-ZN);
    if(!pip(x,z)) continue;
    pos[placed*3]=x; pos[placed*3+1]=Math.random()*420; pos[placed*3+2]=z;
    pSpeed[placed]=6+Math.random()*14; placed++;
  }
  pGeo=new THREE.BufferGeometry();
  pGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(pGeo,new THREE.PointsMaterial({color:0x66d9ff,size:3.2,
    transparent:true,opacity:0.55,blending:THREE.AdditiveBlending,depthWrite:false,fog:false})));
})();
(function stars(){
  const N=900, pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const t=Math.random()*Math.PI*2, ph=Math.acos(Math.random()*0.95);
    const r=22000;
    pos[i*3]=r*Math.sin(ph)*Math.cos(t); pos[i*3+1]=r*Math.cos(ph)+2000; pos[i*3+2]=r*Math.sin(ph)*Math.sin(t);
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xcfe8ff,size:2.4,
    transparent:true,opacity:0.7,depthWrite:false,fog:false})));
})();

// ---------- HUD ----------
let roadKm=0;
DATA.roads_main.concat(DATA.roads_minor).forEach(l=>{
  for(let i=0;i<l.length-1;i++) roadKm+=Math.hypot(l[i+1][0]-l[i][0],l[i+1][1]-l[i][1]);
});
document.getElementById('stats').textContent =
  DATA.meta.counts.buildings.toLocaleString('de-DE')+' GEBÄUDE · '+
  Math.round(roadKm/1000)+' KM STRASSEN · '+
  DATA.meta.counts.rails+' GLEIS-SEGMENTE';
const btnR=document.getElementById('btn-rotate'), btnL=document.getElementById('btn-labels'),
      btnRe=document.getElementById('btn-reset'), needle=document.getElementById('needle'),
      coordsEl=document.getElementById('coords');
btnR.onclick=()=>{controls.autoRotate=!controls.autoRotate;
  btnR.innerHTML=controls.autoRotate?'&#10227; AUTO-ROTATION: AN':'&#10227; AUTO-ROTATION: AUS';
  btnR.classList.toggle('off',!controls.autoRotate);};
btnL.onclick=()=>{labelGroup.visible=!labelGroup.visible;
  btnL.textContent='LABELS: '+(labelGroup.visible?'AN':'AUS');
  btnL.classList.toggle('off',!labelGroup.visible);};
btnRe.onclick=()=>{camera.position.copy(CAM_HOME);controls.target.set(PCX,0,PCZ);};
function updHud(){
  const az=controls.getAzimuthalAngle();
  needle.style.transform='rotate('+(-az)+'rad)';
  const t=controls.target;
  const la=LAT0 - t.z/KZ, lo=LON0 + t.x/KX;
  coordsEl.innerHTML='ZIEL<br>'+la.toFixed(5)+' / '+lo.toFixed(5);
}
controls.addEventListener('change',updHud); updHud();

// ---------- Animation ----------
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  beacons.forEach(b=>{
    if(b.sprite){const s=1+0.05*Math.sin(t*2+b.phase);b.mesh.scale.set(340*s,85*s,1);}
    else if(b.ring){b.mesh.material.opacity=b.base*(0.55+0.45*Math.sin(t*2.4+b.phase));}
    else{b.mesh.material.opacity=b.base*(0.7+0.3*Math.sin(t*2+b.phase));}
  });
  scans.forEach(s=>{
    const k=((t*0.12)+s.off)%1;
    s.mesh.scale.set(k*DIAG/2,k*DIAG/2,1);
    s.mesh.material.opacity=(1-k)*0.45;
  });
  const pa=pGeo.getAttribute('position');
  for(let i=0;i<pSpeed.length;i++){
    let y=pa.array[i*3+1]+pSpeed[i]*dt;
    if(y>430)y=0; pa.array[i*3+1]=y;
  }
  pa.needsUpdate=true;
  controls.update();
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
animate();
requestAnimationFrame(()=>{document.getElementById('loading').style.display='none';});
})();
</script>
